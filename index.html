
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://em-content.zobj.net/source/apple/391/clapper-board_1f3ac.png">

    <title>MOZINHOFLIX</title>
</head>

<body>

    <header>
        
        <!-- MENU HAMBURGUER -->
        <nav class="menu-navegacao">

            <button id="menuBotao" class="menu-botao" aria-label="Abrir menu">
            ☰
            </button>

            <div id="menuOpcoes" class="menu-opcoes">

                <a href="index.html">🏠 Início</a>
                <a href="assistidos.html">🎬 Filmes assistidos</a>

            </div>

        </nav>

        <h1>MOZINHOFLIX</h1>
        <h2>FILMES PARA NÓS ASSISTIRMOS JUNTINHAS EM CASA OU NO CINEMA</h2>
        <h3>Sujeito a briga se assistir alguma dessas opções sozinha ou com outra pessoa que não seja o seu amor!</h3>
    </header>

    <main>

        <section class="pesquisa">

            <h2>ENCONTRE UM FILME</h2>

            <div class="barra-pesquisa">
                <input
                    type="text"
                    id="campoBusca"
                    placeholder="Digite o nome do filme..."
                >

                <button id="buscarBtn">Pesquisar</button>
            </div>

            <div id="resultadosBusca"></div>
            <p id="mensagemBusca"></p>

        </section>

        <section class="catalogo">

            <h2>NOSSA LISTA DE FILMES</h2>

            <div class="carrossel-container">

                <button
                    class="seta-carrossel"
                    id="anteriorFilmes"
                    aria-label="Filmes anteriores"
                >
                    &#10094;
                </button>

                <div id="listaFilmes">
                    Carregando filmes...
                </div>

                <button
                    class="seta-carrossel"
                    id="proximoFilmes"
                    aria-label="Próximos filmes"
                >
                    &#10095;
                </button>

            </div>

        </section>

    </main>

    <!-- JANELA DE DETALHES DO FILME -->

    <div
        id="modalDetalhes"
        class="modal-detalhes"
        aria-hidden="true"
    >

        <div
            class="modal-conteudo"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloDetalhes"
        >

            <button
                class="fechar-modal"
                id="fecharModal"
                aria-label="Fechar"
            >
                &times;
            </button>

            <div class="detalhes-corpo">

                <img
                    id="posterDetalhes"
                    src=""
                    alt="Pôster do filme"
                >

                <div class="detalhes-informacoes">

                    <h2 id="tituloDetalhes"></h2>

                    <div class="detalhes-metadados">

                        <span id="anoDetalhes"></span>

                        <span id="duracaoDetalhes"></span>

                    </div>

                    <p class="rotulo-detalhes">SINOPSE</p>

                    <p id="sinopseDetalhes"></p>

                    <p class="rotulo-detalhes">GÊNEROS</p>

                    <p id="generosDetalhes"></p>

                </div>

            </div>

        </div>

    </div>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // CONFIGURAÇÕES

        const SUPABASE_URL = "https://xaeeqggwfbftedrppyfj.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CPlL2dpxj5UVAxys6e1Ocg_xiE9PEBH";

        const TMDB_API_KEY = "12b98db281f885582d19d37942c5f3ed";

        const clienteSupabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        let generosTMDB = {};
        let filmesCarregados = [];
        let requisicaoDetalhes = 0;

        // ELEMENTOS DA PÁGINA

        const campoBusca = document.getElementById("campoBusca");
        const resultadosBusca = document.getElementById("resultadosBusca");
        const mensagemBusca = document.getElementById("mensagemBusca");
        const listaFilmes = document.getElementById("listaFilmes");
        const buscarBtn = document.getElementById("buscarBtn");

        const modalDetalhes = document.getElementById("modalDetalhes");
        const fecharModal = document.getElementById("fecharModal");

        const posterDetalhes = document.getElementById("posterDetalhes");
        const tituloDetalhes = document.getElementById("tituloDetalhes");
        const anoDetalhes = document.getElementById("anoDetalhes");
        const duracaoDetalhes = document.getElementById("duracaoDetalhes");
        const sinopseDetalhes = document.getElementById("sinopseDetalhes");
        const generosDetalhes = document.getElementById("generosDetalhes");

        // PROTEGER TEXTOS EXIBIDOS NA PÁGINA

        function escapar(texto) {

            return String(texto ?? "").replace(/[&<>"']/g, caractere => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[caractere]);

        }

        // CARREGAR GÊNEROS DO TMDB

        async function carregarGeneros() {

            const resposta = await fetch(
                `https://api.themoviedb.org/3/genre/movie/list?api_key=${TMDB_API_KEY}&language=pt-BR`
            );

            if (!resposta.ok) {
                throw new Error("Erro ao carregar gêneros.");
            }

            const dados = await resposta.json();

            dados.genres.forEach(genero => {
                generosTMDB[genero.id] = genero.name;
            });

        }

        // PESQUISAR FILMES

        async function pesquisarFilmes() {

            const pesquisa = campoBusca.value.trim();

            if (!pesquisa) {
                mensagemBusca.textContent = "Digite o nome de um filme.";
                resultadosBusca.innerHTML = "";
                return;
            }

            resultadosBusca.innerHTML = "";
            mensagemBusca.textContent = "Procurando filmes...";

            buscarBtn.disabled = true;

            try {

                const resposta = await fetch(
                    `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(pesquisa)}&include_adult=false`
                );

                if (!resposta.ok) {
                    throw new Error("Erro na pesquisa.");
                }

                const dados = await resposta.json();

                if (!dados.results || dados.results.length === 0) {
                    mensagemBusca.textContent = "Nenhum filme encontrado.";
                    return;
                }

                mensagemBusca.textContent = "Escolha o filme que deseja adicionar:";

                dados.results.slice(0, 10).forEach(filme => {

                    const generos = (filme.genre_ids || [])
                        .map(id => generosTMDB[id])
                        .filter(Boolean)
                        .join(", ");

                    const poster = filme.poster_path
                        ? `https://image.tmdb.org/t/p/w500${filme.poster_path}`
                        : "";

                    resultadosBusca.innerHTML += `

                        <div class="resultado-filme">

                            ${poster
                                ? `<img src="${poster}" alt="${escapar(filme.title)}">`
                                : ""
                            }

                            <div>

                                <h3>${escapar(filme.title)}</h3>

                                <p>
                                    ${escapar(filme.overview || "Sinopse indisponível.")}
                                </p>

                                <p>
                                    <strong>Lançamento:</strong>
                                    ${escapar(filme.release_date || "Não informado")}
                                </p>

                                <p>
                                    <strong>Gêneros:</strong>
                                    ${escapar(generos || "Não informado")}
                                </p>

                                <button
                                    class="adicionarBtn"
                                    data-id="${Number(filme.id)}"
                                >
                                    Adicionar ao MOZINHOFLIX
                                </button>

                            </div>

                        </div>

                    `;

                });

            } catch (erro) {

                console.error(erro);

                mensagemBusca.textContent =
                    "Erro ao pesquisar filmes. Confira a conexão com a API.";

            } finally {

                buscarBtn.disabled = false;

            }

        }

        // BOTÃO DE PESQUISA

        buscarBtn.addEventListener("click", pesquisarFilmes);

        // PESQUISAR PRESSIONANDO ENTER

        campoBusca.addEventListener("keydown", evento => {

            if (evento.key === "Enter") {
                pesquisarFilmes();
            }

        });

        // ADICIONAR FILME AO SUPABASE

        resultadosBusca.addEventListener("click", async evento => {

            const botao = evento.target.closest(".adicionarBtn");

            if (!botao) return;

            const idFilme = Number(botao.dataset.id);

            botao.disabled = true;
            botao.textContent = "Adicionando...";

            try {

                const resposta = await fetch(
                    `https://api.themoviedb.org/3/movie/${idFilme}?api_key=${TMDB_API_KEY}&language=pt-BR`
                );

                if (!resposta.ok) {
                    throw new Error("Erro ao buscar detalhes do filme.");
                }

                const filme = await resposta.json();

                const { error } = await clienteSupabase
                    .from("filmes")
                    .insert({

                        tmdb_id: filme.id,
                        titulo: filme.title,
                        sinopse: filme.overview,
                        poster_path: filme.poster_path,
                        data_lancamento: filme.release_date || null,
                        generos: (filme.genres || []).map(genero => genero.name)

                    });

                if (error) {

                    if (error.code === "23505") {

                        mensagemBusca.textContent =
                            "Esse filme já está no nosso catálogo! ❤️";

                    } else {

                        throw error;

                    }

                } else {

                    mensagemBusca.textContent =
                        "Filme adicionado com sucesso! ❤️";

                    await carregarFilmes();

                }

            } catch (erro) {

                console.error(erro);

                mensagemBusca.textContent =
                    "Não foi possível adicionar o filme.";

            } finally {

                botao.disabled = false;
                botao.textContent = "Adicionar ao MOZINHOFLIX";

            }

        });

        // CARREGAR CATÁLOGO COMPARTILHADO

        async function carregarFilmes() {

            listaFilmes.textContent = "Carregando filmes...";

            const { data, error } = await clienteSupabase
                .from("filmes")
                .select("*")
                .order("criado_em", { ascending: false });

            if (error) {

                console.error(error);

                listaFilmes.textContent =
                    "Não foi possível carregar os filmes.";

                return;

            }

            if (!data || data.length === 0) {

                listaFilmes.textContent =
                    "Nosso catálogo ainda está vazio. ❤️";

                return;

            }

            filmesCarregados = data;
            const filmesPendentes = data.filter(filme => !filme.assistido);

            listaFilmes.innerHTML = "";

            filmesPendentes.forEach((filme, index) => {

                const poster = filme.poster_path
                    ? `https://image.tmdb.org/t/p/w500${filme.poster_path}`
                    : "";

                listaFilmes.innerHTML += `

                    <article
                        class="filme-catalogo"
                        data-indice="${index}"
                        tabindex="0"
                        role="button"
                        aria-label="Ver detalhes de ${escapar(filme.titulo)}"
                    >

                        ${
                            poster
                                ? `<img src="${poster}" alt="${escapar(filme.titulo)}" loading="lazy">`
                                : `<div class="poster-indisponivel">Sem pôster</div>`
                        }

                        <h3>${escapar(filme.titulo)}</h3>

                        <button
                            class="marcarAssistidoBtn"
                            data-id="${filme.id}"
                        >
                            ✓ Já assistido
                        </button>

                    </article>

                `;

            });

        }

        // ABRIR DETALHES DO FILME

        async function abrirDetalhes(filme) {

            const identificador = ++requisicaoDetalhes;

            const poster = filme.poster_path
                ? `https://image.tmdb.org/t/p/w500${filme.poster_path}`
                : "";

            posterDetalhes.src = poster;
            posterDetalhes.alt = escapar(filme.titulo);
            posterDetalhes.hidden = !poster;

            tituloDetalhes.textContent = filme.titulo || "Filme";

            anoDetalhes.textContent = filme.data_lancamento
                ? filme.data_lancamento.substring(0, 4)
                : "Ano não informado";

            sinopseDetalhes.textContent =
                filme.sinopse || "Sinopse indisponível.";

            const generos = Array.isArray(filme.generos)
                ? filme.generos.join(", ")
                : "";

            generosDetalhes.textContent =
                generos || "Gêneros não informados.";

            duracaoDetalhes.textContent = "Consultando duração...";

            modalDetalhes.classList.add("ativo");
            modalDetalhes.setAttribute("aria-hidden", "false");

            document.body.style.overflow = "hidden";

            fecharModal.focus();

            // BUSCAR DURAÇÃO NO TMDB

            if (!filme.tmdb_id) {

                duracaoDetalhes.textContent = "Duração não informada.";
                return;

            }

            try {

                const resposta = await fetch(
                    `https://api.themoviedb.org/3/movie/${filme.tmdb_id}?api_key=${TMDB_API_KEY}&language=pt-BR`
                );

                if (!resposta.ok) {
                    throw new Error("Não foi possível consultar a duração.");
                }

                const detalhes = await resposta.json();

                if (identificador !== requisicaoDetalhes) return;

                if (detalhes.runtime) {

                    duracaoDetalhes.textContent =
                        `${detalhes.runtime} minutos`;

                } else {

                    duracaoDetalhes.textContent =
                        "Duração não informada.";

                }

            } catch (erro) {

                console.error(erro);

                if (identificador === requisicaoDetalhes) {
                    duracaoDetalhes.textContent =
                        "Duração indisponível.";
                }

            }

        }

        // CLICAR NA CAPA PARA ABRIR DETALHES

        listaFilmes.addEventListener("click", evento => {
            if (evento.target.closest(".marcarAssistidoBtn")) return;

            const card = evento.target.closest(".filme-catalogo");

            if (!card) return;

            const indice = Number(card.dataset.indice);

            const filme = filmesCarregados[indice];

            if (filme) {
                abrirDetalhes(filme);
            }

        });

        // ABRIR DETALHES PELO TECLADO

        listaFilmes.addEventListener("keydown", evento => {

            if (
                evento.key !== "Enter" &&
                evento.key !== " "
            ) return;

            const card = evento.target.closest(".filme-catalogo");

            if (!card) return;

            evento.preventDefault();

            const filme = filmesCarregados[
                Number(card.dataset.indice)
            ];

            if (filme) {
                abrirDetalhes(filme);
            }

        });

        // MARCAR FILME COMO ASSISTIDO
        
        listaFilmes.addEventListener("click", async evento => {
        
            const botao = evento.target.closest(".marcarAssistidoBtn");
        
            if (!botao) return;
        
            evento.stopPropagation();
        
            const idFilme = botao.dataset.id;
        
            botao.disabled = true;
            botao.textContent = "Salvando...";
        
            try {
        
                const { error } = await clienteSupabase
                    .from("filmes")
                    .update({ assistido: true })
                    .eq("id", idFilme);
        
                if (error) throw error;
        
                await carregarFilmes();
        
            } catch (erro) {
        
                console.error(erro);
        
                alert("Não foi possível marcar o filme como assistido.");
        
                botao.disabled = false;
                botao.textContent = "✓ Já assistido";
        
            }
        
        });


        // FECHAR JANELA DE DETALHES

        function fecharDetalhes() {

            requisicaoDetalhes++;

            modalDetalhes.classList.remove("ativo");
            modalDetalhes.setAttribute("aria-hidden", "true");

            document.body.style.overflow = "";

        }

        fecharModal.addEventListener("click", fecharDetalhes);

        modalDetalhes.addEventListener("click", evento => {

            if (evento.target === modalDetalhes) {
                fecharDetalhes();
            }

        });

        document.addEventListener("keydown", evento => {

            if (
                evento.key === "Escape" &&
                modalDetalhes.classList.contains("ativo")
            ) {
                fecharDetalhes();
            }

        });

        // NAVEGAÇÃO DO CARROSSEL

        const anteriorFilmes = document.getElementById("anteriorFilmes");
        const proximoFilmes = document.getElementById("proximoFilmes");

        anteriorFilmes.addEventListener("click", () => {

            listaFilmes.scrollBy({
                left: -listaFilmes.clientWidth * 0.8,
                behavior: "smooth"
            });

        });

        proximoFilmes.addEventListener("click", () => {

            listaFilmes.scrollBy({
                left: listaFilmes.clientWidth * 0.8,
                behavior: "smooth"
            });

        });


        // ABRIR E FECHAR MENU
        
        const menuBotao = document.getElementById("menuBotao");
        const menuOpcoes = document.getElementById("menuOpcoes");
        
        menuBotao.addEventListener("click", () => {
        
            const aberto = menuOpcoes.classList.toggle("aberto");
        
            menuBotao.textContent = aberto ? "✕" : "☰";
        
        });
        
        document.addEventListener("click", evento => {
        
            if (
                !evento.target.closest(".menu-navegacao")
            ) {
        
                menuOpcoes.classList.remove("aberto");
                menuBotao.textContent = "☰";
        
            }
        
        });

        
        // INICIAR SITE

        async function iniciarSite() {

            try {

                await carregarGeneros();

                await carregarFilmes();

            } catch (erro) {

                console.error(erro);

                mensagemBusca.textContent =
                    "Erro ao iniciar o site.";

            }

        }

        iniciarSite();

    </script>

</body>

</html>
